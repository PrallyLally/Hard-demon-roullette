<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hard Demon Roulette</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
  text-align: center;
  padding: 20px;
}

.card {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.good { background: #2ecc71; }
.next { background: #3498db; }
.fail { background: #e74c3c; }
</style>
</head>

<body>

<h1>🔥 Hard Demon Roulette</h1>

<div class="card">
  <h2 id="level">Press Start</h2>
  <p id="info">Random Hard Demon will appear</p>
  <p>Progress: <span id="percent">0</span>%</p>
</div>

<button class="next" onclick="startGame()">Start / Next Level</button>
<button class="good" onclick="complete()">+1% Complete</button>
<button class="fail" onclick="giveUp()">Give Up</button>

<script>

// 💀 BIG HARD DEMON POOL (REAL COMMUNITY LEVELS)
const levels = [
  {name:"Nine Circles"}, {name:"Jawbreaker"}, {name:"Fairydust"},
  {name:"Forest Temple"}, {name:"Future Funk"}, {name:"CraZy"},
  {name:"Ultra Drivers"}, {name:"Problematic"}, {name:"BuTiTi II"},
  {name:"Psychosis"}, {name:"Dark Travel"}, {name:"Ditched Machine"},
  {name:"The Caverns"}, {name:"Crazy II"}, {name:"Toxin Lab III"},
  {name:"Astralith"}, {name:"White Women"}, {name:"Different Descent"},
  {name:"Back on Mountain"}, {name:"HeLL"}, {name:"Feral"},
  {name:"Poltergeist"}, {name:"Ice Carbon Diablo X"},
  {name:"Artifice"}, {name:"Bausha Vortex"}, {name:"El Dorado"},
  {name:"Hi"}, {name:"Carcano"}, {name:"Forest Temple II"},
  {name:"Space Locked"}, {name:"Fairydust Redux"},
  {name:"Paracosm Circles"}, {name:"Hexagon Force II"},
  {name:"Speed of Light II"}, {name:"Electrodynamix II"},
  {name:"Problematic II"}, {name:"Nine Circles Pack Level"},
  {name:"Dark Hell"}, {name:"Mystic Bounds"},
  {name:"Bloodbath Z"}, {name:"Ziroikabi"},
  {name:"The Flawless"}, {name:"Ultra Paracosm"},
  {name:"Death Step"}, {name:"Mechanical Showdown"},
  {name:"Darkness Keeper"}, {name:"Hyper Circles"},
  {name:"Silent Circles"}, {name:"Clubstep Reborn"}
];

let percent = 0;
let current = null;

// 🎲 TRUE RANDOM PICK
function pickLevel() {
  const index = Math.floor(Math.random() * levels.length);
  current = levels[index];

  document.getElementById("level").innerText = current.name;
  document.getElementById("info").innerText = "Hard Demon selected randomly 💀";
}

function startGame() {
  pickLevel();
}

function complete() {
  if (!current) return;

  percent++;
  document.getElementById("percent").innerText = percent;

  if (percent >= 100) {
    document.getElementById("level").innerText =
      "YOU SURVIVED 100 HARD DEMONS 💀🔥";
    document.getElementById("info").innerText = "";
  } else {
    pickLevel();
  }
}

function giveUp() {
  document.getElementById("level").innerText = "Skill issue detected 💀";
  document.getElementById("info").innerText = "";
}

</script>

</body>
</html>
